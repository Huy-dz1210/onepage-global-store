name: Unpack project.zip
on:
  push:
    paths: ["project.zip"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repository root
        run: |
          set -e
          rm -rf /tmp/p && mkdir /tmp/p
          unzip -q project.zip -d /tmp/p
          src=/tmp/p/onepage-global-store
          [ -d "$src" ] || src=/tmp/p
          shopt -s dotglob
          cp -r "$src"/* .
          rm -f project.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Onepage Global Store source code"
          git push
